default:
  JAGS_DATA:
    seed: 69 #set NULL for random seed
    chains: 3
    iterations: 10000
    burn_in: 5000
    thin: 1
    save_parameters:
      - "pi"
      - "p"
      - "eta"
  DATA_META:
    id_column_name: "Sample_Name"
    training_column_name: "training"
    class_column_prefix: "CL_"
    feature_column_prefix: "FE_"
  ANALYSIS:
    groups: # include a substring, like "_human", to group columns together
      human:
        - "_human"
      meat:
        - "_chicken"
        - "_pork"
        - "_beef"
        - "_turkey"
  OPTIONS:
    delete_temp_files: FALSE